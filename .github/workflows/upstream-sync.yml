# IterativShield™ — Weekly upstream diff review
# Compares iterativ/customise against superagent-ai/superagent:main
# and opens a summary issue if new commits are detected.
#
# Maintains the divergence log contract defined in UPSTREAM.md.

name: Upstream Sync Review

on:
  schedule:
    # Every Monday at 07:00 UTC
    - cron: "0 7 * * 1"
  workflow_dispatch: {}  # allow manual trigger

permissions:
  contents: read
  issues: write

jobs:
  upstream-diff:
    name: Diff against superagent-ai/superagent
    runs-on: ubuntu-latest

    steps:
      - name: Checkout iterativshield (iterativ/customise)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/superagent-ai/superagent.git
          git fetch upstream main --depth=50

      - name: Compute divergence stats
        id: diff
        run: |
          AHEAD=$(git rev-list --count upstream/main..HEAD)
          BEHIND=$(git rev-list --count HEAD..upstream/main)
          NEW_UPSTREAM=$(git log upstream/main --not HEAD --oneline | head -20)
          echo "ahead=$AHEAD" >> $GITHUB_OUTPUT
          echo "behind=$BEHIND" >> $GITHUB_OUTPUT
          {
            echo 'new_upstream<<EOF'
            echo "$NEW_UPSTREAM"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Skip if upstream is unchanged
        if: steps.diff.outputs.behind == '0'
        run: echo "No new upstream commits. Skipping issue creation."

      - name: Open upstream-sync issue
        if: steps.diff.outputs.behind != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const ahead  = '${{ steps.diff.outputs.ahead }}';
            const behind = '${{ steps.diff.outputs.behind }}';
            const newCommits = `${{ steps.diff.outputs.new_upstream }}`;
            const today = new Date().toISOString().slice(0, 10);

            const body = [
              `## IterativShield\u2122 \u2014 Weekly Upstream Sync Report (${today})`,
              '',
              `| Metric | Value |`,
              `|--------|-------|`,
              `| Commits ahead of upstream | ${ahead} |`,
              `| New upstream commits to review | ${behind} |`,
              '',
              '### New upstream commits',
              '```',
              newCommits || '(none)',
              '```',
              '',
              '### Action required',
              '- [ ] Review each upstream commit for security relevance',
              '- [ ] Update `UPSTREAM.md` divergence log if any commit affects `guard`, `redact`, or `scan`',
              '- [ ] Cherry-pick or adapt any upstream security fixes',
              '- [ ] Close this issue once review is complete',
              '',
              '_Auto-generated by `.github/workflows/upstream-sync.yml`_',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `\uD83D\uDD04 Upstream sync review \u2014 ${today} (${behind} new commits)`,
              body,
              labels: ['upstream-sync', 'maintenance'],
            });

  lint-and-type-check:
    name: Lint + type-check iterativ package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: pip install ruff mypy

      - name: Ruff lint
        run: ruff check iterativ/

      - name: Mypy type check
        run: mypy iterativ/ --ignore-missing-imports
