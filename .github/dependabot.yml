version: 2
updates:
  # npm: mcp/
  - package-ecosystem: "npm"
    directory: "/mcp"
    schedule:
      interval: "weekly"
    groups:
      mcp-security:
        patterns: ["*"]
    open-pull-requests-limit: 10

  # npm: docs/
  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"
    groups:
      docs-security:
        patterns: ["*"]
    open-pull-requests-limit: 10

  # npm: cli/
  - package-ecosystem: "npm"
    directory: "/cli"
    schedule:
      interval: "weekly"
    groups:
      cli-security:
        patterns: ["*"]
    open-pull-requests-limit: 10

  # pip: root (iterativshield SDK)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
